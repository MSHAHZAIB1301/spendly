{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<nav class="navbar">
    <div class="nav-inner">
        <a href="{{ url_for('landing') }}" class="nav-brand">
            <span class="brand-icon">◈</span>
            <span class="brand-name">Spendly</span>
        </a>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>
</nav>

<div class="expense-form-container">
    <h1>Add New Expense</h1>

    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_expense') }}">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" step="0.01" id="amount" name="amount" class="form-input" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-input" required>
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Health">Health</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" class="form-input" placeholder="What was this for?">
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" class="form-input" value="{{ now }}" required>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('dashboard') }}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-submit">Add Expense</button>
        </div>
    </form>
</div>

<style>
.expense-form-container { max-width: 500px; margin: 0 auto; padding: 20px; }
.expense-form-container h1 { text-align: center; margin-bottom: 30px; }
.form-error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
.form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn-cancel { background: #6c757d; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; }
.btn-submit { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
</style>
{% endblock %}
