{% extends "base.html" %}

{% block title %}Set New Password — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Set New Password</h1>
            <p class="auth-subtitle">Enter your email and new password</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           class="form-input" placeholder="Enter your email"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="Min. 8 characters"
                           required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           class="form-input" placeholder="Re-enter password"
                           required>
                </div>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </div>

    </div>
</section>

{% endblock %}
